services:
  - type: web
    name: tekki-pm-backend
    runtime: node
    region: singapore
    buildCommand: cd backend && npm install
    startCommand: cd backend && node src/app.js
    nodeVersion: 20
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 1h
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: WS_CORS_ORIGIN
        sync: false
